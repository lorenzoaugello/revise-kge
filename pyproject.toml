[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revise-kge"
version = "0.1.0"
description = "Reproducible experiments for continual KGE with additions, removals, and substitutions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
  "tqdm>=4.65",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
